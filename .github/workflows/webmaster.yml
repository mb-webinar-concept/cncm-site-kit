# Webmaster agent: acts only when a person with write access comments "@claude ..." on an issue or
# pull request (the action itself enforces write access). It works on a branch and opens a pull request;
# nothing reaches the site until a person reviews and merges it. Rules for the agent live in CLAUDE.md.
# Needs the Claude GitHub App and a secret: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (see docs/AGENTS.md).
name: Webmaster agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: webmaster-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  webmaster:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools the agent needs to build and test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install codespell==2.4.1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,WebFetch,Bash(python3 tools/build.py),Bash(python3 tools/squarespace_to_csv.py:*),Bash(npx playwright test:*),Bash(python3 -m unittest:*),Bash(git status),Bash(git diff:*),Bash(git log:*)"
