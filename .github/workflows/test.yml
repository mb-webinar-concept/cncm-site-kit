# Runs on every push and pull request: rebuild the paste-in files and run every browser test.
# A red X on GitHub means something broke; the HTML report is attached to the run.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 tools/build.py
      - name: Built files must be committed
        run: git diff --exit-code -- dist sandbox || (echo "Run 'npm run build' and commit dist/ and sandbox/." && exit 1)
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
